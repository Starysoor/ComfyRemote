name: QA Android Emulator Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: ['release/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  emulator-smoke:
    # Regression matrix for the project workbench (#57 P0): oldest supported
    # API, current phone target, and a tablet form factor.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api29-phone
            api-level: 29
            target: google_apis
            profile: pixel_3a
          - name: api34-phone
            api-level: 34
            target: google_apis
            profile: pixel_3a
          - name: api34-tablet
            api-level: 34
            target: google_apis
            profile: nexus_10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned-for-release but debug-signed APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, cold-start, force-stop, relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/qa_emulator_smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-qa-emulator-evidence-${{ matrix.name }}-${{ github.sha }}
          path: tools/qa-screens/
          retention-days: 7
          if-no-files-found: warn
