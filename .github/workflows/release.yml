name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION app=$APP_VERSION"
          test -n "$APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match Gradle versionName $APP_VERSION" >&2
            exit 1
          fi

      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/comfyremote.jks
          printf 'storeFile=keystore/comfyremote.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KS_PASS }}" "${{ secrets.KS_ALIAS }}" "${{ secrets.KS_PASS }}" > keystore.properties

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
